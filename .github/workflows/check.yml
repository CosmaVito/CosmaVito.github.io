name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate HTML
        run: npx --yes html-validate@11.16.1 index.html
      - name: Accessibility (axe)
        run: npx --yes @axe-core/cli@4.13.0 "file://$PWD/index.html" --exit --chromedriver-path "$CHROMEWEBDRIVER/chromedriver"
